name: CMake Build

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true

      release_name:
        description: 'Release title'
        required: false
        default: ''

      release_body:
        description: 'Release description'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache build artifact
        id: cache-build
        uses: actions/cache@v4
        with:
          path: BeatSaberBridgeAPI-*.zip
          key: build-${{ runner.os }}-${{ github.sha }}

      - name: Read SDK cache key
        id: sdk-key
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: echo "key=discord-sdk-$(tr -d '[:space:]' < scripts/sdk-sha256.txt)" >> $GITHUB_OUTPUT

      - name: Cache Discord SDK
        id: cache-sdk
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: lib/discord_social_sdk
          key: ${{ steps.sdk-key.outputs.key }}-${{ runner.os }}

      - name: Set up SDK
        if: steps.cache-build.outputs.cache-hit != 'true' && steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        env:
          SDK_DOWNLOAD_URL: ${{ vars.SDK_DOWNLOAD_URL }}
          SDK_DOWNLOAD_TOKEN: ${{ secrets.SDK_DOWNLOAD_TOKEN }}
        run: |
          bash scripts/setup-sdk.sh

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-build.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends libpulse0 libzip-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS' && steps.cache-build.outputs.cache-hit != 'true'
        run: brew install libzip openssl

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-build.outputs.cache-hit != 'true'
        run: vcpkg install libzip:x64-windows

      - name: Set up CMake
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir build && cd build
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cmake .. -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"
          else
            cmake ..
          fi

      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          cd build
          cmake --build . --config Release

      - name: Package and self-test Windows build
        if: runner.os == 'Windows' && steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\Release\BeatSaberBridgeAPI.exe   dist\
          Copy-Item build\Release\discord_partner_sdk.dll  dist\
          Copy-Item build\Release\libssl-3-x64.dll         dist\
          Copy-Item build\Release\libcrypto-3-x64.dll      dist\
          Copy-Item build\Release\zip.dll                  dist\
          .\dist\BeatSaberBridgeAPI.exe --self-test
          Compress-Archive -Path dist\* -DestinationPath BeatSaberBridgeAPI-windows.zip

      - name: Package and self-test Linux build
        if: runner.os == 'Linux' && steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp build/BeatSaberBridgeAPI         dist/
          cp build/libdiscord_partner_sdk.so  dist/
          dist/BeatSaberBridgeAPI --self-test
          cd dist && zip ../BeatSaberBridgeAPI-linux.zip *

      - name: Package and self-test macOS build
        if: runner.os == 'macOS' && steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp build/BeatSaberBridgeAPI                dist/
          cp build/libdiscord_partner_sdk.dylib       dist/

          # Detect the exact paths the linker recorded (version-agnostic)
          LIBSSL_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libssl/{print $1; exit}')
          LIBCRYPTO_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libcrypto/{print $1; exit}')
          LIBZIP_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libzip/{print $1; exit}')

          LIBSSL_NAME=$(basename "$LIBSSL_SRC")
          LIBCRYPTO_NAME=$(basename "$LIBCRYPTO_SRC")
          LIBZIP_NAME=$(basename "$LIBZIP_SRC")

          cp "$LIBSSL_SRC"    "dist/$LIBSSL_NAME"
          cp "$LIBCRYPTO_SRC" "dist/$LIBCRYPTO_NAME"
          cp "$LIBZIP_SRC"    "dist/$LIBZIP_NAME"

          # Rewrite the binary's LC_LOAD_DYLIB entries to use @executable_path
          install_name_tool -change "$LIBSSL_SRC"    "@executable_path/$LIBSSL_NAME"    dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBCRYPTO_SRC" "@executable_path/$LIBCRYPTO_NAME" dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBZIP_SRC"    "@executable_path/$LIBZIP_NAME"    dist/BeatSaberBridgeAPI

          # Fix libssl's internal reference to libcrypto
          LIBSSL_CRYPTO_REF=$(otool -L "dist/$LIBSSL_NAME" | awk '/libcrypto/{print $1; exit}')
          install_name_tool -change "$LIBSSL_CRYPTO_REF" "@executable_path/$LIBCRYPTO_NAME" "dist/$LIBSSL_NAME"

          # Fix libzip's internal reference to libcrypto (not all builds include this)
          LIBZIP_CRYPTO_REF=$(otool -L "dist/$LIBZIP_NAME" | awk '/libcrypto/{print $1; exit}')
          if [ -n "$LIBZIP_CRYPTO_REF" ]; then
            install_name_tool -change "$LIBZIP_CRYPTO_REF" "@executable_path/$LIBCRYPTO_NAME" "dist/$LIBZIP_NAME"
          fi

          dist/BeatSaberBridgeAPI --self-test
          cd dist && zip ../BeatSaberBridgeAPI-macos.zip *

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: BeatSaberBridgeAPI-windows.zip

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: BeatSaberBridgeAPI-linux.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: BeatSaberBridgeAPI-macos.zip

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: binaries

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: binaries

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}

          name: ${{ github.event.inputs.release_name != '' &&
            github.event.inputs.release_name ||
            github.event.inputs.tag_name }}

          body: ${{ github.event.inputs.release_body }}

          files: |
            binaries/BeatSaberBridgeAPI-windows.zip
            binaries/BeatSaberBridgeAPI-linux.zip
            binaries/BeatSaberBridgeAPI-macos.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
